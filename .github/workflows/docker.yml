# =============================================================================
# ADs Growth System - Docker Build & Push
# =============================================================================
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

# Without this, every push to a branch started a fresh backend + frontend
# image build and left the superseded ones running to completion. ci.yml has
# carried the same guard for a while; this brings Docker in line.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  # ===========================================================================
  # Build Backend Docker Image
  # ===========================================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ===========================================================================
  # Build Frontend Docker Image
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=https://api.stratum.ai/api/v1

  # ===========================================================================
  # Docker Compose Integration Test
  # ===========================================================================
  compose-test:
    name: Compose Test
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # Was `== 'pull_request'`, which would make this job dead code now that the
    # pull_request trigger is gone. Kept alive on push so the integration smoke
    # test still runs — but note it now gates post-merge rather than pre-merge.
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create test .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=stratum
          POSTGRES_PASSWORD=test_password
          POSTGRES_DB=stratum_ai
          SECRET_KEY=test-secret-key
          JWT_SECRET_KEY=test-jwt-secret
          PII_ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVz
          APP_ENV=test
          REDIS_PASSWORD=test_redis_password
          WHATSAPP_VERIFY_TOKEN=test_whatsapp_verify_token
          FLOWER_PASSWORD=test_flower_password
          # Skip the startup ML auto-train: the image bakes models at build time
          # (build_ml_models.py), but the api service bind-mounts ./backend over
          # /app, shadowing them — runtime training would block /health and OOM
          # the 1G limit. The health check doesn't need ML models.
          ML_AUTO_TRAIN=false
          # The lifespan superadmin seeder imports scripts/seed_superadmin, which
          # sys.exit(1)s at import when these are unset (SystemExit isn't caught
          # by the lifespan's except Exception). Railway sets them; provide test
          # values here so startup completes and /health responds.
          SUPERADMIN_EMAIL=admin@stratum.test
          SUPERADMIN_PASSWORD=test_superadmin_password_change_me
          EOF

      - name: Start services
        run: |
          docker compose up -d db redis
          sleep 10

      - name: Check service health
        run: |
          docker compose ps
          docker compose logs db --tail=20
          docker compose logs redis --tail=20

      - name: Build and start API
        run: |
          docker compose build api
          docker compose up -d api
          sleep 30

      - name: Health check API
        run: |
          curl -f http://localhost:8000/health || (docker compose logs api && exit 1)

      - name: Cleanup
        if: always()
        run: docker compose down -v
