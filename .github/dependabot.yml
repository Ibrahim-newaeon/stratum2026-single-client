# =============================================================================
# Dependabot Configuration
# =============================================================================
version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # scipy 1.18.0 dropped Python 3.11 (Requires-Python >=3.12). This project
      # pins 3.11 in both places that matter — ci.yml PYTHON_VERSION and
      # backend/Dockerfile `FROM python:3.11-slim-bookworm` — so the bump is
      # not merely risky, it is uninstallable:
      #   ERROR: No matching distribution found for scipy>=1.18.0
      # Verified by `pip install` in a python:3.11 container; see PR #24, which
      # is left open rather than merged. Without this ignore, Dependabot
      # reopens the same unmergeable PR on every weekly scan.
      # REMOVE THIS ENTRY when the project moves to Python 3.12.
      - dependency-name: "scipy"
        versions: [">=1.18.0"]
      # boto3 >=1.43.58 makes the requirement set unresolvable. pip walks the
      # botocore/s3transfer/yarl version space and gives up:
      #   error: resolution-too-deep
      #   × Dependency resolution exceeded maximum depth
      # `pip install -r requirements.txt` then fails outright, which breaks
      # every backend CI job — not a subtle regression. Bisected in a
      # python:3.11 container: the baseline resolves, and the other four
      # floor bumps in the same batch (#41 #43 #44) and the python-minor
      # group (#38) each resolve; only boto3 fails. See PR #42, left open
      # rather than merged.
      # Counter-intuitive but reproduced twice: RAISING the floor widens the
      # space pip must explore rather than narrowing it.
      # REMOVE THIS ENTRY when the pin can be re-tested against a resolver
      # that handles it (or once boto3/botocore constraints loosen).
      # No `versions:` bound on purpose. The first attempt pinned
      # `>=1.43.58`; Dependabot came straight back with `>=1.43.57` (PR #50),
      # one patch underneath it, which fails resolution identically —
      # confirmed by dry-run in a python:3.11 container. Version-bounded
      # ignores just invite the next number down, so this ignores boto3
      # updates outright until the resolver problem is understood.
      # Note this does NOT freeze the installed boto3: the floor stays
      # `>=1.34.0`, so pip still picks up newer releases that resolve. It
      # only stops Dependabot proposing a raised floor.
      - dependency-name: "boto3"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors land as ONE bundled PR so they get triaged together via the
      # upgrade-dependency skill instead of 5+ individual major-bump PRs.
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typescript 7.x cannot be linted. typescript-eslint refuses to load
      # against it and throws outright rather than degrading:
      #   Error: typescript-eslint does not support TS 7.0.
      # `eslint --max-warnings 0` then fails for the whole frontend, so the
      # bump breaks CI regardless of whether the code itself typechecks — and
      # it does: tsc --noEmit, the production build and 935/935 vitest all
      # pass on TS 7.0.2. Verified in a node:22 container while splitting the
      # npm-major group; see PR #26, closed rather than merged, and its
      # replacements #69 #70 #71.
      # Upstream tracking: typescript-eslint/typescript-eslint#10940, which
      # targets support for TS >= 7.1.
      # REMOVE THIS ENTRY once that ships, then take the major deliberately.
      # Ignoring the update-type rather than a version range, on the lesson
      # from boto3 above: a bounded ignore just invites the next number down.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors land as ONE bundled PR (see python-major note above).
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # Docker
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
