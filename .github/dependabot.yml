# =============================================================================
# Dependabot Configuration
# =============================================================================
version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # scipy 1.18.0 dropped Python 3.11 (Requires-Python >=3.12). This project
      # pins 3.11 in both places that matter — ci.yml PYTHON_VERSION and
      # backend/Dockerfile `FROM python:3.11-slim-bookworm` — so the bump is
      # not merely risky, it is uninstallable:
      #   ERROR: No matching distribution found for scipy>=1.18.0
      # Verified by `pip install` in a python:3.11 container; see PR #24, which
      # is left open rather than merged. Without this ignore, Dependabot
      # reopens the same unmergeable PR on every weekly scan.
      # REMOVE THIS ENTRY when the project moves to Python 3.12.
      - dependency-name: "scipy"
        versions: [">=1.18.0"]
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors land as ONE bundled PR so they get triaged together via the
      # upgrade-dependency skill instead of 5+ individual major-bump PRs.
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors land as ONE bundled PR (see python-major note above).
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # Docker
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
